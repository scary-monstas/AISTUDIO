<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCM AI STUDIO</title>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Phosphor Icons for premium UI -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg-dark: #0f111a;
            --bg-panel: #1a1d27;
            --bg-hover: #252936;
            --primary: #6366f1; /* Indigo */
            --primary-hover: #4f46e5;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --accent: #0ea5e9;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Layout */
        .sidebar {
            width: 320px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        /* Sidebar Header */
        .brand {
            padding: 24px 20px;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
            color: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .new-btn-container { padding: 20px; }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            transition: all 0.2s;
        }
        .btn:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-outline { background-color: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-outline:hover { background-color: var(--bg-hover); }
        .btn-danger { background-color: transparent; border: 1px solid var(--danger); color: var(--danger); }
        .btn-danger:hover { background-color: var(--danger); color: white; }

        /* Site List */
        .site-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px 20px 10px;
        }
        .site-item {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .site-item:hover { background-color: var(--bg-hover); }
        .site-item.active {
            background-color: rgba(99, 102, 241, 0.1);
            border-color: var(--primary);
        }
        .site-name { font-weight: 600; font-size: 15px; margin-bottom: 4px; display: block; }
        .site-date { font-size: 12px; color: var(--text-muted); }

        /* Main Editor Area */
        .header {
            padding: 24px 40px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h2 { margin: 0; font-size: 24px; font-weight: 600; }
        .header-actions { display: flex; gap: 12px; }

        .editor-container {
            padding: 40px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .input-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-weight: 500; font-size: 14px; color: var(--text-muted); }
        
        .subdomain-wrapper {
            display: flex;
            align-items: center;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .subdomain-wrapper:focus-within { border-color: var(--primary); }
        
        input[type="text"] {
            background: transparent;
            border: none;
            color: white;
            padding: 14px;
            flex: 1;
            font-size: 16px;
            outline: none;
        }
        .domain-suffix {
            padding: 14px 16px;
            background: rgba(255,255,255,0.05);
            color: var(--text-muted);
            font-weight: 500;
            border-left: 1px solid var(--border);
        }

        /* Drag & Drop Code Editor */
        .code-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            background: var(--bg-panel);
        }
        .code-header {
            padding: 12px 16px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-muted);
        }
        textarea {
            flex: 1;
            width: 100%;
            background: transparent;
            color: #a5b4fc; /* Code-like color */
            border: none;
            padding: 20px;
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            outline: none;
        }
        
        /* Drag Overlay */
        .drag-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(99, 102, 241, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 10;
        }
        .code-wrapper.dragover .drag-overlay { opacity: 1; pointer-events: all; }

        /* Status Toast */
        #statusToast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 16px 24px;
            border-radius: 8px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateY(150%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
        }
        #statusToast.show { transform: translateY(0); }

        /* Responsive */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 250px; border-right: none; border-bottom: 1px solid var(--border); }
            .header { padding: 15px 20px; flex-direction: column; align-items: flex-start; gap: 15px; }
            .editor-container { padding: 20px; }
        }
    </style>
</head>
<body>

<script>
    // ==========================================
    // 1. CONFIGURATION (PASTE YOUR KEYS HERE)
    // ==========================================
    const NETLIFY_TOKEN = 'nfp_3yj2Qosk5HrXH1Hc4aza7eou3cQYfCTcf3af';
    
    const SUPABASE_URL = 'https://qsmuypaapwdrzhfdrepe.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzbXV5cGFhcHdkcnpoZmRyZXBlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMjY3NjMsImV4cCI6MjEwMDgwMjc2M30.GuMdd-1O_BHtQ3sVztYKk9aBiJaPBUsXJif2mHVv8ko';

    // Initialize Supabase Client
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // App State
    let sites = [];
    let currentSiteId = null; // null means creating a new site, UUID means editing existing
</script>

<!-- UI Layout -->
<div class="sidebar">
    <div class="brand">
        <i class="ph-fill ph-code"></i> BCM AI STUDIO
    </div>
    <div class="new-btn-container">
        <button class="btn" onclick="startNewSite()">
            <i class="ph ph-plus"></i> Create New Project
        </button>
    </div>
    <div class="site-list" id="siteList">
        <!-- Loaded from Supabase -->
        <div style="text-align:center; padding: 20px; color: var(--text-muted); font-size: 14px;">Loading projects...</div>
    </div>
</div>

<div class="main-content">
    <div class="header">
        <h2 id="editorTitle">New Project</h2>
        <div class="header-actions" id="headerActions" style="display: none;">
            <button class="btn btn-outline" onclick="openLiveSite()" title="View Live Site">
                <i class="ph ph-arrow-square-out"></i> Live
            </button>
            <button class="btn btn-outline" onclick="downloadCode()" title="Download HTML">
                <i class="ph ph-download-simple"></i> Download
            </button>
            <button class="btn btn-danger" onclick="deleteCurrentSite()" title="Delete Project">
                <i class="ph ph-trash"></i> Delete
            </button>
        </div>
    </div>

    <div class="editor-container">
        <div class="input-group">
            <label for="subdomain">Site Name (Subdomain)</label>
            <div class="subdomain-wrapper">
                <input type="text" id="subdomain" placeholder="my-awesome-ai-app" autocomplete="off">
                <div class="domain-suffix">.netlify.app</div>
            </div>
        </div>

        <div class="code-wrapper" id="dropZone">
            <div class="drag-overlay">
                <i class="ph ph-file-html" style="font-size: 48px; margin-bottom: 10px;"></i>
                Drop HTML file to load
            </div>
            <div class="code-header">
                <span><i class="ph ph-file-code"></i> index.html</span>
                <span>You can drag & drop a file here</span>
            </div>
            <textarea id="codeEditor" placeholder="<!DOCTYPE html>&#10;<html>&#10;<body>&#10;  <h1>Hello BCM AI STUDIO</h1>&#10;</body>&#10;</html>"></textarea>
        </div>

        <button class="btn" id="deployBtn" onclick="handleDeploy()" style="padding: 16px; font-size: 16px;">
            <i class="ph ph-rocket-launch"></i> <span id="deployBtnText">Deploy to Netlify</span>
        </button>
    </div>
</div>

<!-- Toast Notification -->
<div id="statusToast">
    <i class="ph ph-info" id="toastIcon" style="font-size: 24px;"></i>
    <span id="toastMsg">Action successful!</span>
</div>

<script>
    // ==========================================
    // 2. UI & STATE MANAGEMENT
    // ==========================================

    document.addEventListener('DOMContentLoaded', () => {
        setupDragAndDrop();
        fetchSites();
    });

    function showToast(msg, isError = false) {
        const toast = document.getElementById('statusToast');
        const icon = document.getElementById('toastIcon');
        document.getElementById('toastMsg').innerText = msg;
        
        toast.style.borderColor = isError ? 'var(--danger)' : 'var(--primary)';
        icon.className = isError ? 'ph ph-warning-circle' : 'ph ph-check-circle';
        icon.style.color = isError ? 'var(--danger)' : 'var(--primary)';
        
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 4000);
    }

    function startNewSite() {
        currentSiteId = null;
        document.getElementById('editorTitle').innerText = 'New Project';
        document.getElementById('subdomain').value = '';
        document.getElementById('subdomain').disabled = false;
        document.getElementById('codeEditor').value = '';
        document.getElementById('deployBtnText').innerText = 'Deploy to Netlify';
        document.getElementById('headerActions').style.display = 'none';
        renderSiteList(); // removes active class
    }

    function selectSite(id) {
        const site = sites.find(s => s.id === id);
        if(!site) return;

        currentSiteId = id;
        document.getElementById('editorTitle').innerText = 'Editing: ' + site.name;
        document.getElementById('subdomain').value = site.name;
        document.getElementById('subdomain').disabled = true; // Can't change name after creation easily here
        document.getElementById('codeEditor').value = site.last_code;
        document.getElementById('deployBtnText').innerText = 'Update Deployment';
        document.getElementById('headerActions').style.display = 'flex';
        renderSiteList();
    }

    // ==========================================
    // 3. DRAG AND DROP LOGIC
    // ==========================================
    function setupDragAndDrop() {
        const dropZone = document.getElementById('dropZone');
        const editor = document.getElementById('codeEditor');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) { e.preventDefault(); e.stopPropagation(); }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0) {
                const file = files[0];
                const reader = new FileReader();
                reader.onload = (e) => {
                    editor.value = e.target.result;
                    showToast('File loaded successfully!');
                };
                reader.readAsText(file);
            }
        }, false);
    }

    // ==========================================
    // 4. SUPABASE DATABASE OPERATIONS
    // ==========================================
    async function fetchSites() {
        try {
            const { data, error } = await supabase
                .from('bcm_sites')
                .select('*')
                .order('created_at', { ascending: false });
            
            if (error) throw error;
            sites = data;
            renderSiteList();
        } catch (err) {
            console.error(err);
            showToast('Failed to load projects from Supabase.', true);
        }
    }

    function renderSiteList() {
        const list = document.getElementById('siteList');
        list.innerHTML = '';
        
        if(sites.length === 0) {
            list.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted); font-size: 14px;">No projects yet.</div>';
            return;
        }

        sites.forEach(site => {
            const div = document.createElement('div');
            div.className = `site-item ${site.id === currentSiteId ? 'active' : ''}`;
            div.onclick = () => selectSite(site.id);
            
            const date = new Date(site.created_at).toLocaleDateString();
            div.innerHTML = `
                <span class="site-name">${site.name}</span>
                <span class="site-date">Deployed: ${date}</span>
            `;
            list.appendChild(div);
        });
    }

    // ==========================================
    // 5. NETLIFY + CORE LOGIC
    // ==========================================
    
    // SHA-1 for Netlify Digest
    async function calculateSHA1(text) {
        const encoder = new TextEncoder();
        const data = encoder.encode(text);
        const hashBuffer = await crypto.subtle.digest('SHA-1', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function handleDeploy() {
        const code = document.getElementById('codeEditor').value.trim();
        const subdomain = document.getElementById('subdomain').value.trim();
        
        if (!code) return showToast('Please enter or drop some HTML code first.', true);
        if (!NETLIFY_TOKEN.startsWith('nfp_')) return showToast('Please configure your Netlify Token in the code.', true);

        const btn = document.getElementById('deployBtn');
        btn.disabled = true;
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="ph ph-spinner ph-spin"></i> Processing...';

        try {
            if (currentSiteId) {
                // UPDATE EXISTING SITE
                const site = sites.find(s => s.id === currentSiteId);
                await deployToNetlify(site.netlify_site_id, code);
                
                // Update Supabase
                await supabase.from('bcm_sites').update({ last_code: code }).eq('id', currentSiteId);
                
                // Update local state
                site.last_code = code;
                showToast('Deployment updated successfully!');
            } else {
                // CREATE NEW SITE
                const sitePayload = subdomain ? { name: subdomain } : {};
                
                // 1. Create site on Netlify
                const siteRes = await fetch('https://api.netlify.com/api/v1/sites', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${NETLIFY_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(sitePayload)
                });
                if (!siteRes.ok) throw new Error(await siteRes.text());
                const netlifySite = await siteRes.json();

                // 2. Deploy Code
                await deployToNetlify(netlifySite.id, code);

                // 3. Save to Supabase
                const newRecord = {
                    netlify_site_id: netlifySite.id,
                    name: netlifySite.name,
                    url: netlifySite.url,
                    admin_url: netlifySite.admin_url,
                    last_code: code
                };
                
                const { data, error } = await supabase.from('bcm_sites').insert([newRecord]).select();
                if (error) throw error;

                // Update UI
                sites.unshift(data[0]);
                selectSite(data[0].id);
                showToast('New site created and deployed!');
            }
        } catch (err) {
            console.error(err);
            showToast(err.message || 'Deployment failed.', true);
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    }

    async function deployToNetlify(netlifySiteId, code) {
        const fileSha = await calculateSHA1(code);
        const filesDigest = { '/index.html': fileSha };

        // Create Deploy
        const deployRes = await fetch(`https://api.netlify.com/api/v1/sites/${netlifySiteId}/deploys`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${NETLIFY_TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ files: filesDigest })
        });
        if (!deployRes.ok) throw new Error('Failed to create deploy digest.');
        const deploy = await deployRes.json();

        // Upload File if required
        if (deploy.required && deploy.required.includes(fileSha)) {
            const uploadRes = await fetch(`https://api.netlify.com/api/v1/deploys/${deploy.id}/files/index.html`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${NETLIFY_TOKEN}`, 'Content-Type': 'application/octet-stream' },
                body: code
            });
            if (!uploadRes.ok) throw new Error('Failed to upload file content.');
        }
    }

    // ==========================================
    // 6. HELPER ACTIONS (Download, Delete, Live)
    // ==========================================
    
    function openLiveSite() {
        const site = sites.find(s => s.id === currentSiteId);
        if(site) window.open(site.url, '_blank');
    }

    function downloadCode() {
        const code = document.getElementById('codeEditor').value;
        const blob = new Blob([code], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const site = sites.find(s => s.id === currentSiteId);
        a.download = site ? `${site.name}.html` : 'index.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('File downloaded.');
    }

    async function deleteCurrentSite() {
        if (!confirm('Are you sure you want to permanently delete this project from Netlify and the Database?')) return;
        
        const site = sites.find(s => s.id === currentSiteId);
        if(!site) return;

        try {
            // Delete from Netlify
            const delRes = await fetch(`https://api.netlify.com/api/v1/sites/${site.netlify_site_id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${NETLIFY_TOKEN}` }
            });
            if (!delRes.ok && delRes.status !== 404) throw new Error('Failed to delete from Netlify.');

            // Delete from Supabase
            const { error } = await supabase.from('bcm_sites').delete().eq('id', currentSiteId);
            if (error) throw error;

            // Update UI
            sites = sites.filter(s => s.id !== currentSiteId);
            startNewSite();
            showToast('Project deleted successfully.');

        } catch (err) {
            console.error(err);
            showToast('Failed to delete project.', true);
        }
    }
</script>
</body>
</html>
