<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCM AI STUDIO</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Phosphor Icons for premium UI -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        :root {
            --bg-dark: #0f111a;
            --bg-panel: #1a1d27;
            --bg-hover: #252936;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --accent: #0ea5e9;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Layout */
        .sidebar {
            width: 320px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 10;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        /* Sidebar Header */
        .brand {
            padding: 24px 20px;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
            color: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .new-btn-container { padding: 20px; }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            transition: all 0.2s;
        }
        .btn:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-outline { background-color: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-outline:hover { background-color: var(--bg-hover); }
        .btn-danger { background-color: transparent; border: 1px solid var(--danger); color: var(--danger); }
        .btn-danger:hover { background-color: var(--danger); color: white; }

        /* Site List */
        .site-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px 20px 10px;
        }
        .site-item {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .site-item:hover { background-color: var(--bg-hover); }
        .site-item.active {
            background-color: rgba(99, 102, 241, 0.1);
            border-color: var(--primary);
        }
        .site-name { font-weight: 600; font-size: 15px; display: block; word-break: break-all; }
        .site-sub { font-size: 11px; color: var(--accent); }
        .site-date { font-size: 12px; color: var(--text-muted); }

        /* Main Editor Area */
        .header {
            padding: 24px 40px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h2 { margin: 0; font-size: 24px; font-weight: 600; }
        .header-actions { display: flex; gap: 12px; }

        .editor-container {
            padding: 40px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .input-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-weight: 500; font-size: 14px; color: var(--text-muted); }
        
        input[type="text"].standard-input {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: white;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"].standard-input:focus { border-color: var(--primary); }

        .subdomain-wrapper {
            display: flex;
            align-items: center;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .subdomain-wrapper:focus-within { border-color: var(--primary); }
        
        .subdomain-wrapper input[type="text"] {
            background: transparent;
            border: none;
            color: white;
            padding: 14px;
            flex: 1;
            font-size: 16px;
            outline: none;
        }
        .domain-suffix {
            padding: 14px 16px;
            background: rgba(255,255,255,0.05);
            color: var(--text-muted);
            font-weight: 500;
            border-left: 1px solid var(--border);
        }

        /* Drag & Drop Code Editor */
        .code-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            background: var(--bg-panel);
        }
        .code-header {
            padding: 12px 16px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-muted);
        }
        textarea {
            flex: 1;
            width: 100%;
            background: transparent;
            color: #a5b4fc;
            border: none;
            padding: 20px;
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            outline: none;
        }
        
        /* Drag Overlay */
        .drag-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(99, 102, 241, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 10;
        }
        .code-wrapper.dragover .drag-overlay { opacity: 1; pointer-events: all; }

        /* Status Toast */
        #statusToast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 16px 24px;
            border-radius: 8px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateY(150%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 9999;
            max-width: 400px;
            line-height: 1.4;
        }
        #statusToast.show { transform: translateY(0); }

        /* Env Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center;
            z-index: 99999;
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .modal-overlay.show { opacity: 1; pointer-events: all; }
        .modal-content {
            background: var(--bg-panel);
            padding: 30px;
            border-radius: 12px;
            width: 600px;
            max-width: 90%;
            border: 1px solid var(--border);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .env-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .env-row input { flex: 1; background: var(--bg-dark); border: 1px solid var(--border); color: white; padding: 12px; border-radius: 6px; outline: none; }
        .env-row input:focus { border-color: var(--primary); }
        .help-text { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }
        code { background: var(--bg-dark); padding: 2px 6px; border-radius: 4px; color: var(--accent); }

        /* Responsive */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 250px; border-right: none; border-bottom: 1px solid var(--border); }
            .header { padding: 15px 20px; flex-direction: column; align-items: flex-start; gap: 15px; }
            .editor-container { padding: 20px; }
        }
    </style>
</head>
<body>

<!-- UI Layout -->
<div class="sidebar">
    <div class="brand">
        <i class="ph-fill ph-code"></i> BCM AI STUDIO
    </div>
    <div class="new-btn-container">
        <button class="btn" id="btnNewProject">
            <i class="ph ph-plus"></i> Create New Project
        </button>
    </div>
    <div class="site-list" id="siteList">
        <div style="text-align:center; padding: 20px; color: var(--text-muted); font-size: 14px;">Loading projects...</div>
    </div>
</div>

<div class="main-content">
    <div class="header">
        <h2 id="editorTitle">New Project</h2>
        <div class="header-actions" id="headerActions" style="display: none;">
            <button class="btn btn-outline" id="btnLive" title="View Live Site">
                <i class="ph ph-arrow-square-out"></i> Live
            </button>
            <button class="btn btn-outline" id="btnDownload" title="Download HTML">
                <i class="ph ph-download-simple"></i> Download
            </button>
            <button class="btn btn-danger" id="btnDelete" title="Delete Project">
                <i class="ph ph-trash"></i> Delete
            </button>
        </div>
    </div>

    <div class="editor-container">
        <div style="display: flex; gap: 20px;">
            <div class="input-group" style="flex: 1;">
                <label for="projectName">Project Name (Team Reference)</label>
                <input type="text" id="projectName" class="standard-input" placeholder="e.g. Client Landing Page" autocomplete="off">
            </div>

            <div class="input-group" style="flex: 1;">
                <label for="subdomain">Netlify Subdomain</label>
                <div class="subdomain-wrapper">
                    <input type="text" id="subdomain" placeholder="my-awesome-ai-app" autocomplete="off">
                    <div class="domain-suffix">.netlify.app</div>
                </div>
            </div>
        </div>

        <div class="code-wrapper" id="dropZone">
            <div class="drag-overlay">
                <i class="ph ph-file-html" style="font-size: 48px; margin-bottom: 10px;"></i>
                Drop HTML file to load
            </div>
            <div class="code-header">
                <span><i class="ph ph-file-code"></i> index.html</span>
                <span id="saveStatus" style="display: none; align-items: center; gap: 4px; font-weight: 500;"></span>
            </div>
            <textarea id="codeEditor" placeholder="<!DOCTYPE html>&#10;<html>&#10;<body>&#10;  <h1>Hello BCM AI STUDIO</h1>&#10;  <script>&#10;    // Access your environment variables anywhere like this:&#10;    console.log(window.ENV.API_KEY);&#10;  </script>&#10;</body>&#10;</html>"></textarea>
        </div>

        <div style="display: flex; gap: 10px;">
            <button class="btn btn-outline" id="btnEnv" style="flex: 1; padding: 16px; font-size: 16px;">
                <i class="ph ph-sliders"></i> Environment Variables
            </button>
            <button class="btn" id="btnDeploy" style="flex: 2; padding: 16px; font-size: 16px;">
                <i class="ph ph-rocket-launch" id="deployBtnIcon"></i> <span id="deployBtnText">Deploy to Netlify</span>
            </button>
        </div>
    </div>
</div>

<!-- Env Variables Modal -->
<div id="envModal" class="modal-overlay">
    <div class="modal-content">
        <h3 style="margin-top: 0;">Environment Variables</h3>
        <p class="help-text">These variables are securely injected into your site's header by Netlify. Access them in your HTML/JS using <code>window.ENV.YOUR_KEY_NAME</code>.</p>
        
        <div id="envList"></div>
        
        <button class="btn btn-outline" id="btnAddEnvRow" style="margin-top: 10px; width: auto;">+ Add Variable</button>
        
        <div style="margin-top: 25px; display: flex; gap: 10px; justify-content: flex-end;">
            <button class="btn btn-outline" id="btnCancelEnv" style="width: auto;">Cancel</button>
            <button class="btn" id="btnSaveEnv" style="width: auto;">Save & Close</button>
        </div>
    </div>
</div>

<!-- Toast Notification -->
<div id="statusToast">
    <i class="ph ph-info" id="toastIcon" style="font-size: 24px; flex-shrink: 0;"></i>
    <span id="toastMsg">Action successful!</span>
</div>

<script>
    // ==========================================
    // 1. CONFIGURATION 
    // ==========================================
    const NETLIFY_TOKEN = 'nfp_3yj2Qosk5HrXH1Hc4aza7eou3cQYfCTcf3af';
    const SUPABASE_URL = 'https://qsmuypaapwdrzhfdrepe.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzbXV5cGFhcHdkcnpoZmRyZXBlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMjY3NjMsImV4cCI6MjEwMDgwMjc2M30.GuMdd-1O_BHtQ3sVztYKk9aBiJaPBUsXJif2mHVv8ko';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let sites = [];
    let currentSiteId = null;
    let autoSaveTimer = null;
    let currentEnvVars = {}; // Holds environment variables locally before deploy

    // ==========================================
    // 2. EVENT LISTENERS
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('btnNewProject').addEventListener('click', startNewSite);
        document.getElementById('btnDeploy').addEventListener('click', handleDeploy);
        document.getElementById('btnLive').addEventListener('click', openLiveSite);
        document.getElementById('btnDownload').addEventListener('click', downloadCode);
        document.getElementById('btnDelete').addEventListener('click', deleteCurrentSite);
        
        // Env Modal Listeners
        document.getElementById('btnEnv').addEventListener('click', openEnvModal);
        document.getElementById('btnAddEnvRow').addEventListener('click', () => addEnvRow());
        document.getElementById('btnCancelEnv').addEventListener('click', closeEnvModal);
        document.getElementById('btnSaveEnv').addEventListener('click', saveEnvModal);

        // Auto-save listener
        document.getElementById('codeEditor').addEventListener('input', handleAutoSave);

        setupDragAndDrop();
        fetchSites();
    });

    // ==========================================
    // 3. UI & STATE MANAGEMENT
    // ==========================================
    function showToast(msg, isError = false) {
        const toast = document.getElementById('statusToast');
        const icon = document.getElementById('toastIcon');
        document.getElementById('toastMsg').innerText = msg;
        
        toast.style.borderColor = isError ? 'var(--danger)' : 'var(--primary)';
        icon.className = isError ? 'ph ph-warning-circle' : 'ph ph-check-circle';
        icon.style.color = isError ? 'var(--danger)' : 'var(--primary)';
        
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 4000);
    }

    function startNewSite() {
        currentSiteId = null;
        currentEnvVars = {};
        document.getElementById('editorTitle').innerText = 'New Project';
        document.getElementById('projectName').value = '';
        document.getElementById('projectName').disabled = false;
        document.getElementById('subdomain').value = '';
        document.getElementById('subdomain').disabled = false;
        document.getElementById('codeEditor').value = '';
        document.getElementById('deployBtnText').innerText = 'Deploy to Netlify';
        document.getElementById('headerActions').style.display = 'none';
        document.getElementById('saveStatus').style.display = 'none';
        renderSiteList();
    }

    async function selectSite(id) {
        const site = sites.find(s => s.id === id);
        if(!site) return;

        currentSiteId = id;
        document.getElementById('editorTitle').innerText = 'Editing: ' + site.name;
        document.getElementById('projectName').value = site.name;
        document.getElementById('projectName').disabled = false;
        
        let sub = '';
        if (site.url) {
            try { sub = new URL(site.url).hostname.split('.')[0]; } catch(e) {}
        }
        document.getElementById('subdomain').value = sub;
        document.getElementById('subdomain').disabled = true; 
        
        document.getElementById('codeEditor').value = site.last_code;
        
        const btnTextSpan = document.getElementById('deployBtnText');
        const btnIcon = document.getElementById('deployBtnIcon');
        if (btnTextSpan) btnTextSpan.innerText = 'Loading...';
        if (btnIcon) btnIcon.className = 'ph ph-spinner ph-spin';
        
        // Fetch Environment Variables from Netlify Snippets
        await fetchEnvVars(site.netlify_site_id);
        
        if (btnTextSpan) btnTextSpan.innerText = 'Update Deployment';
        if (btnIcon) btnIcon.className = 'ph ph-rocket-launch';
        
        document.getElementById('headerActions').style.display = 'flex';
        document.getElementById('saveStatus').style.display = 'none';
        renderSiteList();
    }

    // ==========================================
    // 4. ENVIRONMENT VARIABLES LOGIC
    // ==========================================
    function openEnvModal() {
        const list = document.getElementById('envList');
        list.innerHTML = '';
        
        for (const [k, v] of Object.entries(currentEnvVars)) {
            addEnvRow(k, v);
        }
        if(Object.keys(currentEnvVars).length === 0) {
            addEnvRow('', '');
        }
        
        document.getElementById('envModal').classList.add('show');
    }

    function closeEnvModal() {
        document.getElementById('envModal').classList.remove('show');
    }

    function addEnvRow(k = '', v = '') {
        const div = document.createElement('div');
        div.className = 'env-row';
        div.innerHTML = `
            <input type="text" placeholder="API_KEY_NAME" value="${k}" class="env-key">
            <input type="text" placeholder="Value (e.g. sk-12345)" value="${v}" class="env-val">
            <button class="btn btn-danger" style="width: auto; padding: 12px;" onclick="this.parentElement.remove()">
                <i class="ph ph-trash"></i>
            </button>
        `;
        document.getElementById('envList').appendChild(div);
    }

    function saveEnvModal() {
        currentEnvVars = {};
        document.querySelectorAll('.env-row').forEach(row => {
            const k = row.querySelector('.env-key').value.trim();
            const v = row.querySelector('.env-val').value.trim();
            if (k) currentEnvVars[k] = v;
        });
        closeEnvModal();
        showToast('Variables saved locally. Click Deploy to push them to Netlify.');
    }

    async function fetchEnvVars(netlifySiteId) {
        try {
            const res = await fetch(`https://api.netlify.com/api/v1/sites/${netlifySiteId}/snippets`, {
                headers: { 'Authorization': `Bearer ${NETLIFY_TOKEN}` }
            });
            if(!res.ok) return;
            const snippets = await res.json();
            const envSnippet = snippets.find(s => s.title === 'bcm_env_vars');
            
            if(envSnippet) {
                // Extract JSON from script tag
                const match = envSnippet.general.match(/window\.ENV\s*=\s*(\{.*?\});/);
                if(match && match[1]) {
                    currentEnvVars = JSON.parse(match[1]);
                }
            } else {
                currentEnvVars = {};
            }
        } catch(e) { 
            console.error(e); 
            currentEnvVars = {}; 
        }
    }

    async function syncEnvVars(netlifySiteId) {
        try {
            const res = await fetch(`https://api.netlify.com/api/v1/sites/${netlifySiteId}/snippets`, {
                headers: { 'Authorization': `Bearer ${NETLIFY_TOKEN}` }
            });
            const snippets = await res.json();
            const envSnippet = snippets.find(s => s.title === 'bcm_env_vars');

            // If no vars, delete snippet if it exists
            if (Object.keys(currentEnvVars).length === 0) {
                if (envSnippet) {
                    await fetch(`https://api.netlify.com/api/v1/sites/${netlifySiteId}/snippets/${envSnippet.id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${NETLIFY_TOKEN}` }
                    });
                }
                return;
            }

            // Create snippet string
            const snippetCode = `<script>window.ENV = ${JSON.stringify(currentEnvVars)};<\/script>`;
            const payload = {
                title: "bcm_env_vars",
                general: snippetCode,
                general_position: "head"
            };

            if (envSnippet) {
                // Update existing
                await fetch(`https://api.netlify.com/api/v1/sites/${netlifySiteId}/snippets/${envSnippet.id}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${NETLIFY_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } else {
                // Create new
                await fetch(`https://api.netlify.com/api/v1/sites/${netlifySiteId}/snippets`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${NETLIFY_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            }
        } catch(e) {
            console.error("Failed to sync env vars", e);
        }
    }

    // ==========================================
    // 5. AUTO-SAVE LOGIC
    // ==========================================
    function handleAutoSave() {
        if (!currentSiteId) return;

        const status = document.getElementById('saveStatus');
        status.innerHTML = '<i class="ph ph-spinner ph-spin"></i> Saving...';
        status.style.color = 'var(--text-muted)';
        status.style.display = 'inline-flex';

        clearTimeout(autoSaveTimer);
        autoSaveTimer = setTimeout(async () => {
            const code = document.getElementById('codeEditor').value;
            const projName = document.getElementById('projectName').value.trim();

            try {
                const { error } = await supabaseClient
                    .from('bcm_sites')
                    .update({ 
                        last_code: code,
                        name: projName || "Unnamed Project" 
                    })
                    .eq('id', currentSiteId);
                
                if (error) throw error;

                const site = sites.find(s => s.id === currentSiteId);
                if(site) {
                    site.last_code = code;
                    if(projName) site.name = projName;
                }
                
                renderSiteList();
                status.innerHTML = '<i class="ph ph-check"></i> Saved';
                status.style.color = 'var(--primary)';
                setTimeout(() => status.style.display = 'none', 2000);
            } catch (err) {
                console.error("Auto-save Error:", err);
                status.innerHTML = '<i class="ph ph-warning-circle"></i> Failed to save';
                status.style.color = 'var(--danger)';
            }
        }, 1000);
    }

    // ==========================================
    // 6. DRAG AND DROP LOGIC
    // ==========================================
    function setupDragAndDrop() {
        const dropZone = document.getElementById('dropZone');
        const editor = document.getElementById('codeEditor');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) { e.preventDefault(); e.stopPropagation(); }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0) {
                const file = files[0];
                const reader = new FileReader();
                reader.onload = (ev) => {
                    editor.value = ev.target.result;
                    showToast('File loaded successfully!');
                    handleAutoSave(); 
                };
                reader.readAsText(file);
            }
        }, false);
    }

    // ==========================================
    // 7. SUPABASE DATABASE OPERATIONS
    // ==========================================
    async function fetchSites() {
        try {
            const { data, error } = await supabaseClient
                .from('bcm_sites')
                .select('*')
                .order('created_at', { ascending: false });
            
            if (error) throw error;
            sites = data || [];
            renderSiteList();
        } catch (err) {
            console.error("Supabase Error:", err);
            showToast('Failed to load projects from Database.', true);
        }
    }

    function renderSiteList() {
        const list = document.getElementById('siteList');
        list.innerHTML = '';
        
        if(sites.length === 0) {
            list.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted); font-size: 14px;">No projects yet.</div>';
            return;
        }

        sites.forEach(site => {
            const div = document.createElement('div');
            div.className = `site-item ${site.id === currentSiteId ? 'active' : ''}`;
            
            div.addEventListener('click', () => selectSite(site.id));
            
            const date = new Date(site.created_at).toLocaleDateString();
            
            let subDisplay = 'Unknown URL';
            if (site.url) {
                try { subDisplay = new URL(site.url).hostname; } catch(e){}
            }

            div.innerHTML = `
                <span class="site-name">${site.name}</span>
                <span class="site-sub"><i class="ph ph-link"></i> ${subDisplay}</span>
                <span class="site-date">Deployed: ${date}</span>
            `;
            list.appendChild(div);
        });
    }

    // ==========================================
    // 8. NETLIFY + CORE LOGIC
    // ==========================================
    async function calculateSHA1(text) {
        const encoder = new TextEncoder();
        const data = encoder.encode(text);
        const hashBuffer = await crypto.subtle.digest('SHA-1', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function handleDeploy() {
        const code = document.getElementById('codeEditor').value.trim();
        const subdomain = document.getElementById('subdomain').value.trim();
        const projectName = document.getElementById('projectName').value.trim();
        
        if (!code) return showToast('Please enter or drop some HTML code first.', true);

        const btn = document.getElementById('btnDeploy');
        const btnIcon = document.getElementById('deployBtnIcon');
        const btnTextSpan = document.getElementById('deployBtnText');
        
        btn.disabled = true;
        const originalIcon = btnIcon.className;
        const originalText = btnTextSpan.innerText;
        
        btnIcon.className = 'ph ph-spinner ph-spin';
        btnTextSpan.innerText = 'Processing...';

        try {
            if (currentSiteId) {
                // UPDATE EXISTING SITE
                const site = sites.find(s => s.id === currentSiteId);
                await deployToNetlify(site.netlify_site_id, code);
                await syncEnvVars(site.netlify_site_id); // Sync Env Vars
                
                const finalName = projectName || site.name;
                const { error } = await supabaseClient
                    .from('bcm_sites')
                    .update({ last_code: code, name: finalName })
                    .eq('id', currentSiteId);
                if (error) throw error;
                
                site.last_code = code;
                site.name = finalName;
                renderSiteList();
                document.getElementById('editorTitle').innerText = 'Editing: ' + site.name;
                showToast('Deployment updated successfully!');
            } else {
                // CREATE NEW SITE
                const sitePayload = subdomain ? { name: subdomain } : {};
                
                const siteRes = await fetch('https://api.netlify.com/api/v1/sites', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${NETLIFY_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(sitePayload)
                });
                
                if (!siteRes.ok) {
                    const errData = await siteRes.json().catch(() => ({}));
                    let errMsg = 'Failed to create site.';
                    if (errData.errors && errData.errors.name && errData.errors.name.includes('is already taken')) {
                        errMsg = 'Subdomain is already taken! Please choose another one.';
                    } else if (errData.message) {
                        errMsg = errData.message;
                    }
                    throw new Error(errMsg);
                }
                
                const netlifySite = await siteRes.json();

                await deployToNetlify(netlifySite.id, code);
                await syncEnvVars(netlifySite.id); // Sync Env Vars

                const newRecord = {
                    netlify_site_id: netlifySite.id,
                    name: projectName || netlifySite.name,
                    url: netlifySite.url,
                    admin_url: netlifySite.admin_url,
                    last_code: code
                };
                
                const { data, error } = await supabaseClient.from('bcm_sites').insert([newRecord]).select();
                if (error) throw error;

                sites.unshift(data[0]);
                
                btnIcon.className = originalIcon;
                btnTextSpan.innerText = originalText;
                
                selectSite(data[0].id);
                showToast('New site created and deployed!');
            }
        } catch (err) {
            console.error("Deploy Error:", err);
            showToast(err.message || 'Deployment failed.', true);
        } finally {
            btn.disabled = false;
            if(btnTextSpan.innerText === 'Processing...') {
                btnIcon.className = originalIcon;
                btnTextSpan.innerText = originalText;
            }
        }
    }

    async function deployToNetlify(netlifySiteId, code) {
        const fileSha = await calculateSHA1(code);
        const filesDigest = { '/index.html': fileSha };

        const deployRes = await fetch(`https://api.netlify.com/api/v1/sites/${netlifySiteId}/deploys`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${NETLIFY_TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ files: filesDigest })
        });
        if (!deployRes.ok) throw new Error('Failed to create deploy digest.');
        const deploy = await deployRes.json();

        if (deploy.required && deploy.required.includes(fileSha)) {
            const uploadRes = await fetch(`https://api.netlify.com/api/v1/deploys/${deploy.id}/files/index.html`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${NETLIFY_TOKEN}`, 'Content-Type': 'application/octet-stream' },
                body: code
            });
            if (!uploadRes.ok) throw new Error('Failed to upload file content.');
        }
    }

    // ==========================================
    // 9. HELPER ACTIONS
    // ==========================================
    function openLiveSite() {
        const site = sites.find(s => s.id === currentSiteId);
        if(site) window.open(site.url, '_blank');
    }

    function downloadCode() {
        const code = document.getElementById('codeEditor').value;
        const blob = new Blob([code], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const site = sites.find(s => s.id === currentSiteId);
        a.download = site ? `${site.name}.html` : 'index.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('File downloaded.');
    }

    async function deleteCurrentSite() {
        if (!confirm('Are you sure you want to permanently delete this project from Netlify and the Database?')) return;
        
        const site = sites.find(s => s.id === currentSiteId);
        if(!site) return;

        try {
            const delRes = await fetch(`https://api.netlify.com/api/v1/sites/${site.netlify_site_id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${NETLIFY_TOKEN}` }
            });
            if (!delRes.ok && delRes.status !== 404) throw new Error('Failed to delete from Netlify.');

            const { error } = await supabaseClient.from('bcm_sites').delete().eq('id', currentSiteId);
            if (error) throw error;

            sites = sites.filter(s => s.id !== currentSiteId);
            startNewSite();
            showToast('Project deleted successfully.');

        } catch (err) {
            console.error("Delete Error:", err);
            showToast('Failed to delete project.', true);
        }
    }
</script>
